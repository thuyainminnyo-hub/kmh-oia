name: Education Business OS CI
on:
  pull_request:
    paths:
      - "education-business-os/**"
  push:
    branches: [main]
    paths:
      - "education-business-os/**"
jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: education-business-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Cloud Functions
        run: |
          cd functions
          npm install
          npm run build
      - name: Build Web
        run: |
          cd web
          npm install
          npm run build
  firestore-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: education-business-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rules test dependencies
        run: cd tests && npm install
      - name: Run Firestore rules tests in emulator
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --project demo-education-business-os --only firestore "cd tests && npm test"
