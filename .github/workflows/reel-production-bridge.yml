name: KMH OIA Reel Bridge CI

on:
  pull_request:
    paths:
      - "src/reel_production_bridge.py"
      - "tests/test_reel_production_bridge.py"
      - "src/main.py"
      - ".github/workflows/reel-production-bridge.yml"
  push:
    branches: ["main"]

jobs:
  reel-production-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Reel bridge tests
        run: python -m unittest tests/test_reel_production_bridge.py
      - name: Execute Day 2 RUN01 evidence probe
        run: |
          python - <<'PY'
          import json
          from src.reel_production_bridge import ReelProductionJob, execute_reel_job

          job = ReelProductionJob(
              run_id="KMH-REEL-DAY02-RUN01",
              topic="ကား၊ ဆိုင်ကယ် မောင်းနှင်ရာမှာ သိထားသင့်တဲ့အချက်များ",
          )
          result = execute_reel_job(job)
          print(json.dumps({
              "run_id": result.run_id,
              "stages": result.stages,
              "trace_event_count": result.trace_event_count,
              "response": result.response,
          }, ensure_ascii=False))
          PY
