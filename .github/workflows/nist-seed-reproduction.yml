name: NIST ECDSA seed reproduction

on:
  push:
    paths:
      - "tests/test_nist_ecdsa_seeds.py"
      - ".github/workflows/nist-seed-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4.4.0
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Run published seed reproduction checks
        run: python tests/test_nist_ecdsa_seeds.py
