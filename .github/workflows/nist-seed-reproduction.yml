name: NIST ECDSA seed reproduction

on:
  push:
    paths:
      - "tests/test_nist_ecdsa_seeds.py"
      - ".github/workflows/nist-seed-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-seeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run published seed reproduction checks
        run: python tests/test_nist_ecdsa_seeds.py
