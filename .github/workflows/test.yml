name: KMH OIA Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate performance baseline
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.performance_baseline | tee performance-baseline.json
          python scripts/validate_performance_artifact.py performance-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-performance-baseline
          path: performance-baseline.json
