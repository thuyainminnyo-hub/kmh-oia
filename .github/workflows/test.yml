name: KMH OIA Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.16"
      - run: python -m unittest discover -s tests -v

  performance-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.16"
      - name: Generate and validate performance baseline
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.performance_baseline | tee performance-baseline.json
          python scripts/validate_performance_artifact.py performance-baseline.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: kmh-oia-performance-baseline
          path: performance-baseline.json
