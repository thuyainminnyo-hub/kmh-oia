name: KMH Creative Design Studio QA

on:
  pull_request:
    paths:
      - "case-studies/creative-intelligence-design-studio/**"
      - ".github/workflows/creative-design-studio-qa.yml"
  push:
    branches: ["main", "feat/kmh-creative-intelligence-design-studio-pilot"]
    paths:
      - "case-studies/creative-intelligence-design-studio/**"
      - ".github/workflows/creative-design-studio-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-studies/creative-intelligence-design-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate design contract
        run: python scripts/validate_design_contract.py
      - name: Validate Graphify preflight scope
        run: python scripts/validate_graphify_scope.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace errors
        run: git diff --check
