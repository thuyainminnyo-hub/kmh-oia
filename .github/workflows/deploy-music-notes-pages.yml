name: Deploy KMH Music Notes (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "apps/music-notes/**"
      - ".github/workflows/deploy-music-notes-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-notes-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static app
        run: |
          mkdir -p _site
          cp apps/music-notes/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
