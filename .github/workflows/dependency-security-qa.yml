name: Dependency Security QA

on:
  pull_request:
    paths:
      - "requirements-ci.in"
      - ".github/workflows/dependency-security-qa.yml"
  push:
    branches:
      - main
    paths:
      - "requirements-ci.in"
      - ".github/workflows/dependency-security-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-tools is a lock-generation bootstrap tool. Its own transitive
      # bootstrap dependencies are not covered by requirements-ci.in.
      - name: Install pinned lock generator
        run: python -m pip install "pip-tools==7.6.2"

      - name: Generate transitive hash lock
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file "\${{ runner.temp }}/requirements-ci.lock" \
            requirements-ci.in

      - name: Install only from the generated hash lock
        run: |
          python -m pip install \
            --require-hashes \
            --requirement "\${{ runner.temp }}/requirements-ci.lock"

      - name: Audit the locked dependency set
        run: |
          pip-audit \
            --require-hashes \
            --requirement "\${{ runner.temp }}/requirements-ci.lock"

      - name: Generate CycloneDX SBOM
        run: |
          pip-audit \
            --require-hashes \
            --requirement "\${{ runner.temp }}/requirements-ci.lock" \
            --format cyclonedx-json \
            --output "\${{ runner.temp }}/sbom.cdx.json"

      - name: Validate SBOM JSON
        run: python -m json.tool "\${{ runner.temp }}/sbom.cdx.json" > /dev/null

      - name: Upload lock and SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-evidence
          path: |
            \${{ runner.temp }}/requirements-ci.lock
            \${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: State security boundary
        run: |
          echo "This workflow audits the resolved CI dependency set only."
          echo "It does not prove application runtime security or production readiness."
