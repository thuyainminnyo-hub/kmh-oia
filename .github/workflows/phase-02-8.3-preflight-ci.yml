name: KMH Phase 02.8.3 Runtime Differential Preflight CI

on:
  pull_request:
    branches:
      - "phase-02-8.2-synthetic-graph-differential-20261103"
    paths:
      - "case-studies/creative-intelligence-design-studio/scripts/validate_phase_02_7_graph.py"
      - "case-studies/creative-intelligence-design-studio/tests/test_phase_02_7_graph.py"
      - "case-studies/creative-intelligence-design-studio/tests/test_phase_02_8_2_graph_differential.py"
      - "case-studies/creative-intelligence-design-studio/tests/test_phase_02_8_3_scope_coverage.py"
      - "case-studies/creative-intelligence-design-studio/contracts/phase-02-8.3-runtime-preflight.json"
      - "case-studies/creative-intelligence-design-studio/tests/test_phase_02_8_3_runtime_preflight.py"
      - ".github/workflows/phase-02-8.3-preflight-ci.yml"
  push:
    branches:
      - "work/phase-02-8.3-runtime-preflight-20261103"
    paths:
      - "case-studies/creative-intelligence-design-studio/scripts/validate_phase_02_7_graph.py"
      - "case-studies/creative-intelligence-design-studio/tests/test_phase_02_8_3_scope_coverage.py"
      - ".github/workflows/phase-02-8.3-preflight-ci.yml"

permissions:
  contents: read

jobs:
  validator-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile read-only validator
        run: python -m py_compile case-studies/creative-intelligence-design-studio/scripts/validate_phase_02_7_graph.py
      - name: Run Phase 02.7 validator regression tests
        working-directory: case-studies/creative-intelligence-design-studio
        run: python -m unittest discover -s tests -p 'test_phase_02_7_graph.py' -v
      - name: Run Phase 02.8.2 synthetic differential tests
        working-directory: case-studies/creative-intelligence-design-studio
        run: python -m unittest discover -s tests -p 'test_phase_02_8_2_graph_differential.py' -v
      - name: Run Phase 02.8.3 nested-scope and lexical-import tests
        working-directory: case-studies/creative-intelligence-design-studio
        run: python -m unittest discover -s tests -p 'test_phase_02_8_3_scope_coverage.py' -v
      - name: Validate Phase 02.8.3 runtime preflight contract
        run: python -m json.tool case-studies/creative-intelligence-design-studio/contracts/phase-02-8.3-runtime-preflight.json
      - name: Run Phase 02.8.3 runtime preflight contract tests
        working-directory: case-studies/creative-intelligence-design-studio
        run: python -m unittest discover -s tests -p 'test_phase_02_8_3_runtime_preflight.py' -v
      - name: Check whitespace
        run: git diff --check
