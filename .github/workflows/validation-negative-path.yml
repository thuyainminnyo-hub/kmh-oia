name: KMH OIA Negative-Path Verification

on:
  workflow_dispatch:
    inputs:
      simulate_prerequisite_failure:
        description: "Intentionally fail the prerequisite job to verify fail-closed behavior"
        required: true
        type: boolean
        default: true

jobs:
  prerequisite-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate prerequisite failure when requested
        if: ${{ inputs.simulate_prerequisite_failure }}
        run: |
          echo "Intentional negative-path test: prerequisite-probe will fail."
          exit 1
      - name: Success path when failure injection is disabled
        if: ${{ !inputs.simulate_prerequisite_failure }}
        run: echo "Negative-path injection disabled; prerequisite succeeded."

  verify-fail-closed:
    if: ${{ always() }}
    needs: [prerequisite-probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture scheduler result as a durable receipt
        env:
          PROBE_RESULT: ${{ needs.prerequisite-probe.result }}
          INJECT_FAILURE: ${{ inputs.simulate_prerequisite_failure }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("negative-path-receipt.json").write_text(
              json.dumps({
                  "test": "github_actions_prerequisite_failure_injection",
                  "injected_failure": os.environ["INJECT_FAILURE"].lower() == "true",
                  "prerequisite_result": os.environ["PROBE_RESULT"],
                  "expected_helper_exit": 1 if os.environ["INJECT_FAILURE"].lower() == "true" else 0,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload scheduler-level negative-path receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-negative-path-receipt
          path: negative-path-receipt.json
          if-no-files-found: error
      - name: Assert fail-closed helper matches actual scheduler result
        env:
          TESTS_RESULT: ${{ needs.prerequisite-probe.result }}
          PERFORMANCE_RESULT: success
          REPOSITORY_RESULT: success
          INJECT_FAILURE: ${{ inputs.simulate_prerequisite_failure }}
        run: |
          set +e
          python scripts/check_prerequisite_results.py
          actual_status=$?
          set -e
          if [ "$INJECT_FAILURE" = "true" ]; then
            if [ "$actual_status" -ne 1 ] || [ "$TESTS_RESULT" != "failure" ]; then
              echo "Expected helper exit 1 and scheduler result failure; got exit=$actual_status result=$TESTS_RESULT"
              exit 1
            fi
            echo "PASS: real scheduler failure is detected and fails closed."
          else
            if [ "$actual_status" -ne 0 ] || [ "$TESTS_RESULT" != "success" ]; then
              echo "Expected helper exit 0 and scheduler result success; got exit=$actual_status result=$TESTS_RESULT"
              exit 1
            fi
            echo "PASS: success control path is accepted."
          fi
