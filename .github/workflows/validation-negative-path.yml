name: KMH OIA Negative-Path Verification

on:
  workflow_dispatch:
    inputs:
      simulate_prerequisite_failure:
        description: "Intentionally fail the prerequisite job to verify fail-closed behavior"
        required: true
        type: boolean
        default: true

jobs:
  prerequisite-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate prerequisite failure when requested
        if: ${{ inputs.simulate_prerequisite_failure }}
        run: |
          echo "Intentional negative-path test: prerequisite-probe will fail."
          exit 1
      - name: Success path when failure injection is disabled
        if: ${{ !inputs.simulate_prerequisite_failure }}
        run: echo "Negative-path injection disabled; prerequisite succeeded."

  verify-fail-closed:
    if: ${{ always() }}
    needs: [prerequisite-probe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fail-closed helper and capture complete receipt
        id: capture
        env:
          TESTS_RESULT: ${{ needs.prerequisite-probe.result }}
          PERFORMANCE_RESULT: success
          REPOSITORY_RESULT: success
          INJECT_FAILURE: ${{ inputs.simulate_prerequisite_failure }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          python scripts/check_prerequisite_results.py
          actual_status=$?
          set -e

          ACTUAL_HELPER_EXIT="$actual_status" python - <<'PY'
          import json
          import os
          from pathlib import Path

          injected = os.environ["INJECT_FAILURE"].lower() == "true"
          scheduler_result = os.environ["TESTS_RESULT"]
          expected_exit = 1 if injected else 0
          expected_scheduler_result = "failure" if injected else "success"
          actual_exit = int(os.environ["ACTUAL_HELPER_EXIT"])
          assertion_passed = (
              actual_exit == expected_exit
              and scheduler_result == expected_scheduler_result
          )
          receipt = {
              "test": "github_actions_prerequisite_failure_injection",
              "injected_failure": injected,
              "prerequisite_result": scheduler_result,
              "expected_prerequisite_result": expected_scheduler_result,
              "expected_helper_exit": expected_exit,
              "actual_helper_exit": actual_exit,
              "assertion_passed": assertion_passed,
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
              "commit_sha": os.environ["COMMIT_SHA"],
          }
          Path("negative-path-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"actual_helper_exit={actual_exit}\n")
              output.write(f"assertion_passed={'true' if assertion_passed else 'false'}\n")
          PY

      - name: Upload complete negative-path receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-negative-path-receipt
          path: negative-path-receipt.json
          if-no-files-found: warn

      - name: Enforce receipt assertion
        if: ${{ always() }}
        env:
          ASSERTION_PASSED: ${{ steps.capture.outputs.assertion_passed }}
        run: |
          if [ "$ASSERTION_PASSED" != "true" ]; then
            echo "FAIL: receipt shows the helper did not match the expected scheduler result."
            exit 1
          fi
          echo "PASS: helper exit and actual scheduler result are captured and consistent."
