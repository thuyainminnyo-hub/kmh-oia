name: Repository Action Dependency Assurance

on:
  pull_request:
    paths:
      - ".github/**"
      - "scripts/audit_action_dependencies.py"
      - "tests/test_action_dependency_audit.py"
      - "requirements.txt"
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - "scripts/audit_action_dependencies.py"
      - "tests/test_action_dependency_audit.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-dependency-audit:
    name: Audit action and container dependency references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit action, composite, and container references
        run: python scripts/audit_action_dependencies.py --output audit-results/action-dependency-audit.json

      - name: Run adversarial audit tests
        run: python tests/test_action_dependency_audit.py

      - name: Upload action dependency evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: action-dependency-audit-evidence
          path: audit-results/action-dependency-audit.json
          if-no-files-found: error
          retention-days: 14
