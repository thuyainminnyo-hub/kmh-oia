name: Education Business OS CI
on:
  pull_request:
    paths:
      - "education-business-os/**"
      - ".github/workflows/education-business-os.yml"
  push:
    branches: [main]
    paths:
      - "education-business-os/**"
      - ".github/workflows/education-business-os.yml"
jobs:
  web-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Cloud Functions
        working-directory: education-business-os/functions
        run: |
          npm install
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit-functions.json" || true
          npm run build
      - name: Build Web
        working-directory: education-business-os/web
        run: |
          npm install
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit-web.json" || true
          npm run build
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-business-os-npm-audit
          path: npm-audit-*.json
          if-no-files-found: warn
          retention-days: 14
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install rules test dependencies
        working-directory: education-business-os/tests
        run: |
          npm install
          npm audit --json > "$GITHUB_WORKSPACE/npm-audit-tests.json" || true
      - name: Upload rules test dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: education-business-os-rules-audit
          path: npm-audit-tests.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run Firestore rules tests in emulator
        working-directory: education-business-os
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --project demo-education-business-os --only firestore "cd tests && npm test"
