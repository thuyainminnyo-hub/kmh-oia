name: Reusable Workflow SHA Audit

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/audit_reusable_workflow_refs.py"
      - "tests/test_reusable_workflow_sha_audit.py"
      - "requirements.txt"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/audit_reusable_workflow_refs.py"
      - "tests/test_reusable_workflow_sha_audit.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-workflow-sha-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned CI tooling dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Audit reusable workflow references
        run: python scripts/audit_reusable_workflow_refs.py --output audit-results/reusable-workflow-audit.json

      - name: Run audit unit tests
        run: python tests/test_reusable_workflow_sha_audit.py

      - name: Upload audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reusable-workflow-audit-evidence
          path: audit-results/reusable-workflow-audit.json
          if-no-files-found: error
          retention-days: 14
