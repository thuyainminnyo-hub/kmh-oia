name: KMH Graphify Disposable Synthetic Pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-disposable-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-code-only-extraction:
    name: Install, extract and verify synthetic Graphify pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GRAPHIFY_TAG: v0.9.100
      GRAPHIFY_COMMIT: f5155badddaa3286c78a51653791131e9e2e4d29
    steps:
      - name: Checkout KMH OIA policy and synthetic fixtures
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"

      - name: Verify separate one-run approval and preflight scope
        shell: bash
        working-directory: case-studies/creative-intelligence-design-studio
        run: |
          set -euo pipefail
          python scripts/validate_graphify_scope.py
          python - <<'PY'
          import json
          from pathlib import Path
          approval = json.loads(Path("contracts/graphify-disposable-pilot-approval.json").read_text())
          assert approval["status"] == "approved_single_disposable_run"
          assert approval["max_runs"] == 1
          assert approval["source"]["version"] == "0.9.100"
          assert approval["source"]["commit"] == "f5155badddaa3286c78a51653791131e9e2e4d29"
          assert approval["source"]["uv_lock_blob"] == "1fd2344a28be6b14c4f6f41c4901c70cadc2be0e"
          assert approval["target"]["runner"] == "GitHub-hosted ubuntu-24.04 ephemeral runner"
          assert approval["target"]["scan_files"] == ["src/contract_guard.py", "src/outfit_flow.py", ".graphifyignore"]
          assert approval["execution"]["install_cli_allowed"] is True
          assert approval["execution"]["code_only_extraction_allowed"] is True
          assert approval["execution"]["model_credentials_present"] is False
          assert approval["execution"]["assistant_skill_install_allowed"] is False
          assert approval["execution"]["git_hook_install_allowed"] is False
          assert approval["execution"]["mcp_server_setup_allowed"] is False
          assert approval["execution"]["global_graph_merge_allowed"] is False
          assert approval["execution"]["oia_runtime_integration_allowed"] is False
          assert approval["execution"]["production_deployment_allowed"] is False
          print("PASS: one-run disposable synthetic approval")
          PY

      - name: Create external workspaces and verify source and lock pins
        shell: bash
        run: |
          set -euo pipefail
          WORK_ROOT="$RUNNER_TEMP/kmh-graphify-disposable"
          SOURCE_DIR="$WORK_ROOT/graphify-source"
          SCAN_ROOT="$WORK_ROOT/scan"
          OUTPUT_ROOT="$WORK_ROOT/output"
          EVIDENCE_ROOT="$WORK_ROOT/evidence"
          VENV_DIR="$WORK_ROOT/venv"
          HOME_DIR="$WORK_ROOT/home"
          TMP_DIR="$WORK_ROOT/tmp"
          echo "WORK_ROOT=$WORK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$WORK_ROOT" "$SCAN_ROOT/src" "$OUTPUT_ROOT" "$EVIDENCE_ROOT" "$HOME_DIR" "$TMP_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "SCAN_ROOT=$SCAN_ROOT" >> "$GITHUB_ENV"
          echo "OUTPUT_ROOT=$OUTPUT_ROOT" >> "$GITHUB_ENV"
          echo "EVIDENCE_ROOT=$EVIDENCE_ROOT" >> "$GITHUB_ENV"
          echo "VENV_DIR=$VENV_DIR" >> "$GITHUB_ENV"
          echo "HOME_DIR=$HOME_DIR" >> "$GITHUB_ENV"
          echo "TMP_DIR=$TMP_DIR" >> "$GITHUB_ENV"
          git clone --filter=blob:none --depth 1 --branch "$GRAPHIFY_TAG" https://github.com/Graphify-Labs/graphify.git "$SOURCE_DIR"
          ACTUAL_COMMIT="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$GRAPHIFY_COMMIT"
          LOCK_BLOB="$(git -C "$SOURCE_DIR" rev-parse "$GRAPHIFY_TAG:uv.lock")"
          test "$LOCK_BLOB" = "1fd2344a28be6b14c4f6f41c4901c70cadc2be0e"
          printf '%s\n' "$ACTUAL_COMMIT" > "$EVIDENCE_ROOT/graphify-source-commit.txt"
          printf '%s\n' "$LOCK_BLOB" > "$EVIDENCE_ROOT/graphify-uv-lock-blob.txt"
          uv --version > "$EVIDENCE_ROOT/uv-version.txt"

      - name: Copy only the two approved synthetic Python fixtures
        shell: bash
        working-directory: case-studies/creative-intelligence-design-studio
        run: |
          set -euo pipefail
          cp -- graphify-sandbox/.graphifyignore "$SCAN_ROOT/"
          cp -- graphify-sandbox/src/contract_guard.py "$SCAN_ROOT/src/"
          cp -- graphify-sandbox/src/outfit_flow.py "$SCAN_ROOT/src/"
          test "$(find "$SCAN_ROOT/src" -maxdepth 1 -type f -name '*.py' | wc -l | tr -d ' ')" = "2"
          test "$(find "$SCAN_ROOT" -type f | wc -l | tr -d ' ')" = "3"
          test -z "$(find "$SCAN_ROOT" -type l -print -quit)"
          chmod -R a-w "$SCAN_ROOT"
          (cd "$SCAN_ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE_ROOT/synthetic-scan-manifest.sha256"
          find "$SCAN_ROOT" -type f -printf '%P\n' | sort > "$EVIDENCE_ROOT/synthetic-scan-files.txt"
          diff -u "$EVIDENCE_ROOT/synthetic-scan-files.txt" <(printf '.graphifyignore\nsrc/contract_guard.py\nsrc/outfit_flow.py\n')

      - name: Install Graphify source into an external ephemeral environment
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT="$VENV_DIR"
          cd "$SOURCE_DIR"
          uv sync --frozen --no-dev --python 3.12
          "$VENV_DIR/bin/graphify" --help > "$EVIDENCE_ROOT/graphify-cli-help.txt"
          "$VENV_DIR/bin/python" - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          version = importlib.metadata.version("graphifyy")
          assert version == "0.9.100", version
          Path(os.environ["EVIDENCE_ROOT"], "graphify-version.txt").write_text(version + "\n")
          print("Installed Graphify:", version)
          PY

      - name: Run Graphify code-only extraction with no model credentials
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH="$VENV_DIR/bin:/usr/local/bin:/usr/bin:/bin" HOME="$HOME_DIR" TMPDIR="$TMP_DIR" LANG="C.UTF-8" "$VENV_DIR/bin/graphify" extract "$SCAN_ROOT" --code-only --no-dedup --no-cluster --out "$OUTPUT_ROOT"
          test -s "$OUTPUT_ROOT/graphify-out/graph.json"
          cp -- "$OUTPUT_ROOT/graphify-out/graph.json" "$EVIDENCE_ROOT/graph.json"
          if test -f "$OUTPUT_ROOT/graphify-out/GRAPH_REPORT.md"; then cp -- "$OUTPUT_ROOT/graphify-out/GRAPH_REPORT.md" "$EVIDENCE_ROOT/GRAPH_REPORT.md"; fi

      - name: Verify graph source paths, line references and cross-file evidence
        shell: bash
        working-directory: case-studies/creative-intelligence-design-studio
        run: |
          set -euo pipefail
          python scripts/validate_graphify_output.py --graph "$EVIDENCE_ROOT/graph.json" --scan-root "$SCAN_ROOT" --summary-out "$EVIDENCE_ROOT/traceability-summary.json" --report-out "$EVIDENCE_ROOT/TRACEABILITY_REPORT.md" --tool-version "0.9.100" --source-commit "$GRAPHIFY_COMMIT"

      - name: Upload synthetic graph and traceability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmh-graphify-disposable-pilot-${{ github.run_id }}
          path: ${{ runner.temp }}/kmh-graphify-disposable/evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Destroy ephemeral workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/kmh-graphify-disposable"
