name: MLCW Studio CI
on:
  pull_request:
    paths: ['case-studies/education/my-little-creative-world/studio/**','.github/workflows/mlcw-studio-ci.yml']
  push:
    branches: [main]
    paths: ['case-studies/education/my-little-creative-world/studio/**','.github/workflows/mlcw-studio-ci.yml']
jobs:
  unit-and-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: case-studies/education/my-little-creative-world/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlcw-playwright-report
          path: |
            case-studies/education/my-little-creative-world/studio/playwright-report/
            case-studies/education/my-little-creative-world/studio/test-results/
