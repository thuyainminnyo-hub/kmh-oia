name: Prompt Library Schema QA

on:
  push:
    paths:
      - "schemas/prompt-library-record.schema.json"
      - "scripts/validate_prompt_record.py"
      - "tests/fixtures/prompt-library/**"
      - "data/prompt-library/**"
      - "requirements-ci.in"
      - "requirements-ci.txt"
      - ".github/workflows/prompt-library-schema-qa.yml"
  pull_request:
    paths:
      - "schemas/prompt-library-record.schema.json"
      - "scripts/validate_prompt_record.py"
      - "tests/fixtures/prompt-library/**"
      - "data/prompt-library/**"
      - "requirements-ci.in"
      - "requirements-ci.txt"
      - ".github/workflows/prompt-library-schema-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    env:
      # Force wheel-only installs for pip, pip-tools, and pip-audit subprocesses.
      # This avoids unverified PEP 517 build backends from source distributions.
      PIP_ONLY_BINARY: ":all:"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Generate the complete dependency graph and hashes on the CI runner.
      # pip-tools bootstrap dependencies are a separate, explicitly documented trust boundary.
      - name: Install pinned lock generator
        run: python -m pip install "pip-tools==7.6.2"

      - name: Generate transitive hash lock
        run: |
          pip-compile \
            --resolver=backtracking \
            --generate-hashes \
            --output-file "requirements-ci.lock" \
            requirements-ci.in

      - name: Install validator dependencies with hash verification
        run: |
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            --requirement "requirements-ci.lock"

      - name: Audit the locked dependency set
        run: |
          pip-audit \
            --require-hashes \
            --requirement "requirements-ci.lock"

      - name: Generate CycloneDX SBOM
        run: |
          pip-audit \
            --require-hashes \
            --requirement "requirements-ci.lock" \
            --format cyclonedx-json \
            --output "sbom.cdx.json"

      - name: Validate SBOM JSON
        run: python -m json.tool "sbom.cdx.json" > /dev/null

      - name: Upload lock and SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-evidence
          path: |
            requirements-ci.lock
            sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Positive path — valid draft fixture must pass
        run: python scripts/validate_prompt_record.py tests/fixtures/prompt-library/valid-draft.example.json

      - name: Negative path — invalid fixture must be rejected
        shell: bash
        run: |
          set +e
          python scripts/validate_prompt_record.py tests/fixtures/prompt-library/invalid-record.example.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected schema validator exit code 1 for invalid fixture; got $status"
            exit 1
          fi
          echo "PASS: invalid fixture was rejected with expected exit code 1."

      - name: Validate every controlled Prompt Library record
        shell: bash
        run: |
          shopt -s globstar nullglob
          records=(data/prompt-library/**/*.json)
          if [ ${#records[@]} -eq 0 ]; then
            echo "No controlled Prompt Library records found."
            exit 1
          fi
          for record in "${records[@]}"; do
            echo "Validating $record"
            python scripts/validate_prompt_record.py "$record"
          done

      - name: State test boundary
        run: |
          echo "Schema QA only. No prompt behavior, approval, or production execution is proven by this workflow."
