name: KMH OIA Trusted Runtime Build

# This produces a source release bundle from the exact main commit. It does not sign or deploy.
on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: kmh-oia-trusted-runtime-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-runtime-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate source revision and run full regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src scripts tests
          python scripts/deployment_preflight.py
          python -m unittest discover -s tests -v
      - name: Build deterministic runtime source bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_runtime_bundle.py \
            --source-root . \
            --source-revision "$GITHUB_SHA" \
            --output dist/runtime-source-bundle.tar.gz
          python scripts/validate_runtime_bundle.py dist/runtime-source-bundle.tar.gz \
            --expected-source-sha "$GITHUB_SHA"
      - name: Upload immutable named runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-runtime-bundle
          path: dist/runtime-source-bundle.tar.gz
          if-no-files-found: error
          retention-days: 90
