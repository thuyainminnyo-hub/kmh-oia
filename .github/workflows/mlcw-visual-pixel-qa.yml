name: MLCW Visual Pixel QA

on:
  pull_request:
    paths:
      - "case-studies/education/my-little-creative-world/visual-qa/**"
      - ".github/workflows/mlcw-visual-pixel-qa.yml"
  push:
    branches: ["main", "feat/my-little-creative-world-prototype"]
    paths:
      - "case-studies/education/my-little-creative-world/visual-qa/**"
      - ".github/workflows/mlcw-visual-pixel-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixel-qa-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-studies/education/my-little-creative-world/visual-qa
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned image QA dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic pixel QA tests
        run: python -m unittest -v
