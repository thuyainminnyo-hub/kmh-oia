name: MLCW Character Registry Validation

on:
  pull_request:
    paths:
      - "case-studies/education/my-little-creative-world/**"
      - ".github/workflows/mlcw-registry-validation.yml"
  push:
    branches: ["main", "feat/my-little-creative-world-prototype"]
    paths:
      - "case-studies/education/my-little-creative-world/**"
      - ".github/workflows/mlcw-registry-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: case-studies/education/my-little-creative-world
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Validate JSON/YAML schema and parity
        run: npm run validate:registry
      - name: Run registry retrieval tests
        run: npm run test:registry
