name: Phase 02.9S Source Verification Gate Tests

on:
  pull_request:
    paths:
      - "scripts/verify_graphify_source.py"
      - "tests/test_verify_graphify_source.py"
      - ".github/workflows/phase-02-9s-source-verification.yml"
  push:
    branches:
      - "phase-02-9s-source-verification"
    paths:
      - "scripts/verify_graphify_source.py"
      - "tests/test_verify_graphify_source.py"
      - ".github/workflows/phase-02-9s-source-verification.yml"

permissions:
  contents: read

jobs:
  source-verification-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run source-verifier regression tests (synthetic Git repositories only)
        run: python -m unittest tests.test_verify_graphify_source -v
