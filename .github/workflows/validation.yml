name: KMH OIA Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and validate performance evidence
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.performance_validation | tee performance-validation.json
          python scripts/validate_performance_artifact.py performance-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-performance-validation
          path: performance-validation.json

  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src tests scripts
      - run: python scripts/deployment_preflight.py
      - name: Generate production readiness snapshot
        shell: bash
        run: |
          set +e
          python -m scripts.production_readiness_snapshot > production-readiness-snapshot.json
          snapshot_status=$?
          set -e
          if [ "$snapshot_status" -ne 0 ] && [ "$snapshot_status" -ne 2 ]; then
            echo "Readiness snapshot execution failed with status $snapshot_status"
            cat production-readiness-snapshot.json
            exit "$snapshot_status"
          fi
          python -c "import json; d=json.load(open('production-readiness-snapshot.json')); print('release_decision=' + d['release_decision'])"
          if [ "$snapshot_status" -eq 2 ]; then
            echo "Release readiness is HOLD by design; report artifact will be retained."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-production-readiness-snapshot
          path: production-readiness-snapshot.json
      - run: git diff --check
      - run: python -m unittest discover -s tests -v

  deployment-evidence-bundle:
    if: ${{ always() }}
    needs: [tests, performance-evidence, repository-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture prerequisite job results
        shell: bash
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_HEAD_SHA: ${{ github.sha }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-evidence.result }}
          REPOSITORY_VALIDATION_RESULT: ${{ needs.repository-validation.result }}
        run: |
          python - <<'PY'
          import json
          import os

          run_url = os.environ["CI_RUN_URL"]
          head_sha = os.environ["CI_HEAD_SHA"]
          checks = [
              ("KMH OIA Tests", os.environ["TESTS_RESULT"]),
              ("KMH OIA Performance Evidence", os.environ["PERFORMANCE_RESULT"]),
              ("KMH OIA Repository Validation", os.environ["REPOSITORY_VALIDATION_RESULT"]),
          ]
          rows = [
              {
                  "name": name,
                  "url": run_url,
                  "head_sha": head_sha,
                  "conclusion": conclusion,
                  "is_required_check": True,
              }
              for name, conclusion in checks
          ]
          with open("deployment-ci-runs.json", "w", encoding="utf-8") as stream:
              json.dump(rows, stream, indent=2)
              stream.write("\n")
          print(json.dumps(rows, indent=2))
          PY
      - name: Generate deployment evidence handoff bundle
        run: |
          python -m scripts.deployment_evidence_bundle \
            --commit-sha "${GITHUB_SHA}" \
            --ci-runs deployment-ci-runs.json \
            --output deployment-evidence-bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-deployment-evidence-bundle
          path: deployment-evidence-bundle.json
