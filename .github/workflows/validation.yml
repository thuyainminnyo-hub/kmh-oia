name: KMH OIA Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate performance validation JSON
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH="${GITHUB_WORKSPACE}" python scripts/performance_validation.py | tee performance-validation.json
          test -s performance-validation.json
      - name: Validate performance validation artifact
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          data = json.loads(Path("performance-validation.json").read_text(encoding="utf-8"))
          if not isinstance(data, dict):
              raise SystemExit("Expected a JSON object")
          if type(data.get("iterations")) is not int or data["iterations"] != 50:
              raise SystemExit("Expected exactly 50 validation iterations")
          metrics = ("min_ms", "median_ms", "mean_ms", "max_ms")
          for key in metrics:
              value = data.get(key)
              if type(value) not in (int, float) or not math.isfinite(value) or value < 0:
                  raise SystemExit(f"Invalid metric: {key}")
          if not data["min_ms"] <= data["median_ms"] <= data["max_ms"]:
              raise SystemExit("Invalid min/median/max ordering")
          if not data["min_ms"] <= data["mean_ms"] <= data["max_ms"]:
              raise SystemExit("Invalid min/mean/max ordering")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-performance-validation
          path: performance-validation.json
          if-no-files-found: error

  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src tests scripts
      - run: python scripts/deployment_preflight.py
      - name: Generate production readiness snapshot
        shell: bash
        run: |
          set +e
          python -m scripts.production_readiness_snapshot > production-readiness-snapshot.json
          snapshot_status=$?
          set -e
          if [ "$snapshot_status" -ne 0 ] && [ "$snapshot_status" -ne 2 ]; then
            echo "Readiness snapshot execution failed with status $snapshot_status"
            cat production-readiness-snapshot.json
            exit "$snapshot_status"
          fi
          python -c "import json; d=json.load(open('production-readiness-snapshot.json')); print('release_decision=' + d['release_decision'])"
          if [ "$snapshot_status" -eq 2 ]; then
            echo "Release readiness is HOLD by design; report artifact will be retained."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kmh-oia-production-readiness-snapshot
          path: production-readiness-snapshot.json
          if-no-files-found: error
      - run: git diff --check
      - run: python -m unittest discover -s tests -v

  deployment-evidence-bundle:
    if: ${{ always() }}
    needs: [tests, performance-evidence, repository-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture exact prerequisite job results
        shell: bash
        env:
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_HEAD_SHA: ${{ github.sha }}
          BUNDLE_COMMIT_SHA: ${{ github.sha }}
          TESTS_RESULT: ${{ needs.tests.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-evidence.result }}
          REPOSITORY_RESULT: ${{ needs.repository-validation.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("CI_RUN_URL", "CI_HEAD_SHA", "BUNDLE_COMMIT_SHA",
                      "TESTS_RESULT", "PERFORMANCE_RESULT", "REPOSITORY_RESULT")
          values = {key: os.environ.get(key, "") for key in required}
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit(f"Missing runtime CI metadata: {missing}")
          if "$" in values["CI_RUN_URL"] or "$" in values["CI_HEAD_SHA"]:
              raise SystemExit("Unresolved placeholder in CI metadata")
          if values["CI_HEAD_SHA"] != values["BUNDLE_COMMIT_SHA"]:
              raise SystemExit("CI run SHA does not match bundle commit SHA")

          results = {
              "KMH OIA Tests": values["TESTS_RESULT"],
              "KMH OIA Performance Evidence": values["PERFORMANCE_RESULT"],
              "KMH OIA Repository Validation": values["REPOSITORY_RESULT"],
          }
          rows = [{
              "name": name,
              "url": values["CI_RUN_URL"],
              "head_sha": values["CI_HEAD_SHA"],
              "conclusion": conclusion,
              "is_required_check": True,
          } for name, conclusion in results.items()]
          Path("deployment-ci-runs.json").write_text(
              json.dumps(rows, indent=2) + "\n", encoding="utf-8")
          failed = {name: conclusion for name, conclusion in results.items()
                    if conclusion != "success"}
          if failed:
              print(f"Required CI checks did not all pass: {failed}")
              # Still build the handoff bundle to preserve honest failure evidence.
              # The artifact's CI gate will be NOT_VERIFIED, and this job fails below.
              Path("required-ci-checks-failed.txt").write_text(
                  json.dumps(failed, indent=2) + "\n", encoding="utf-8")
          PY
          python -m scripts.deployment_evidence_bundle \
            --commit-sha "$BUNDLE_COMMIT_SHA" \
            --ci-runs deployment-ci-runs.json \
            --output deployment-evidence-bundle.json
          python - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(Path("deployment-evidence-bundle.json").read_text(encoding="utf-8"))
          gate = bundle.get("gates", [{}])[0]
          if gate.get("status") != "PASS":
              raise SystemExit("Bundle did not verify all required CI jobs for this exact commit SHA")
          if len(gate.get("evidence", [])) != 3:
              raise SystemExit("Expected one evidence row for each of the three prerequisite jobs")
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: kmh-oia-deployment-evidence-bundle
          path: |
            deployment-evidence-bundle.json
            required-ci-checks-failed.txt
          if-no-files-found: warn
      - name: Fail when required CI was not all green
        if: ${{ always() }}
        run: |
          test ! -f required-ci-checks-failed.txt
