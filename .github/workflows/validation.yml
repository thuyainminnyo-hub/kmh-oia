name: KMH OIA Validation

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v

  performance-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Generate and validate performance evidence
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.performance_validation | tee performance-validation.json
          python scripts/validate_performance_artifact.py performance-validation.json
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: kmh-oia-performance-validation
          path: performance-validation.json

  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m compileall -q src tests scripts
      - run: python scripts/deployment_preflight.py
      - name: Generate production readiness snapshot
        shell: bash
        run: |
          set +e
          python -m scripts.production_readiness_snapshot > production-readiness-snapshot.json
          snapshot_status=$?
          set -e
          if [ "$snapshot_status" -ne 0 ] && [ "$snapshot_status" -ne 2 ]; then
            echo "Readiness snapshot execution failed with status $snapshot_status"
            cat production-readiness-snapshot.json
            exit "$snapshot_status"
          fi
          python -c "import json; d=json.load(open('production-readiness-snapshot.json')); print('release_decision=' + d['release_decision'])"
          if [ "$snapshot_status" -eq 2 ]; then
            echo "Release readiness is HOLD by design; report artifact will be retained."
          fi
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: kmh-oia-production-readiness-snapshot
          path: production-readiness-snapshot.json
      - run: git diff --check
      - run: python -m unittest discover -s tests -v

  deployment-evidence-bundle:
    if: ${{ always() }}
    needs: [tests, performance-evidence, repository-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Capture prerequisite job results with real GitHub metadata
        shell: bash
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          PERFORMANCE_RESULT: ${{ needs.performance-evidence.result }}
          VALIDATION_RESULT: ${{ needs.repository-validation.result }}
        run: |
          set -euo pipefail
          jq -n \
            --arg server "$GITHUB_SERVER_URL" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg sha "$GITHUB_SHA" \
            --arg tests_result "$TESTS_RESULT" \
            --arg performance_result "$PERFORMANCE_RESULT" \
            --arg validation_result "$VALIDATION_RESULT" \
            '[
              {name: "KMH OIA Tests", url: ($server + "/" + $repository + "/actions/runs/" + $run_id), head_sha: $sha, conclusion: $tests_result, is_required_check: true},
              {name: "KMH OIA Performance Evidence", url: ($server + "/" + $repository + "/actions/runs/" + $run_id), head_sha: $sha, conclusion: $performance_result, is_required_check: true},
              {name: "KMH OIA Repository Validation", url: ($server + "/" + $repository + "/actions/runs/" + $run_id), head_sha: $sha, conclusion: $validation_result, is_required_check: true}
            ]' > deployment-ci-runs.json
          cat deployment-ci-runs.json
          if grep -Eq '\$\{GITHUB_[A-Z_]+\}' deployment-ci-runs.json; then
            echo "ERROR: unresolved GitHub environment placeholder in CI metadata" >&2
            exit 1
          fi
      - name: Generate deployment evidence handoff bundle
        run: |
          python -m scripts.deployment_evidence_bundle \
            --commit-sha "$GITHUB_SHA" \
            --ci-runs deployment-ci-runs.json \
            --output deployment-evidence-bundle.json
      - name: Enforce evidence bundle CI metadata integrity
        run: |
          python - <<'PY'
          import json, os, sys
          with open("deployment-evidence-bundle.json", encoding="utf-8") as f:
              bundle = json.load(f)
          gate = next(g for g in bundle["gates"] if g["gate"] == "repository_ci_for_bundle_commit")
          expected_sha = os.environ["GITHUB_SHA"]
          errors = list(gate.get("validation_errors", []))
          if bundle.get("bundle_commit_sha") != expected_sha:
              errors.append("bundle commit SHA does not match GITHUB_SHA")
          if gate.get("status") != "PASS":
              errors.append("repository CI evidence gate is not PASS")
          if errors:
              print("Evidence bundle CI metadata integrity failed:")
              print("\n".join(errors))
              sys.exit(1)
          print("Evidence bundle CI metadata integrity: PASS")
          PY
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: kmh-oia-deployment-evidence-bundle
          path: deployment-evidence-bundle.json
