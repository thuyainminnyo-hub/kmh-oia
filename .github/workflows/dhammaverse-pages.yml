name: DhammaVerse Pages

on:
  pull_request:
    paths:
      - "apps/dhammaverse/web/**"
      - ".github/workflows/dhammaverse-pages.yml"
  push:
    branches: [main]
    paths:
      - "apps/dhammaverse/web/**"
      - ".github/workflows/dhammaverse-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhammaverse-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run static and bilingual validation
        run: python apps/dhammaverse/web/validate.py
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dhammaverse/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
