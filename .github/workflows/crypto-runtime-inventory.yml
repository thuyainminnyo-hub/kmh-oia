name: Crypto runtime inventory

on:
  push:
    paths:
      - "scripts/crypto_runtime_inventory.py"
      - ".github/workflows/crypto-runtime-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture runtime inventory
        run: |
          mkdir -p evidence
          python scripts/crypto_runtime_inventory.py | tee evidence/crypto-runtime-inventory.json
      - name: Upload runtime inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: crypto-runtime-inventory
          path: evidence/crypto-runtime-inventory.json
          if-no-files-found: error
          retention-days: 14
