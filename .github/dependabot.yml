version: 2
updates:
  # Keep GitHub Actions dependencies maintained. Dependabot updates the
  # matching actions.lock entries for already-onboarded workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5

  # Keep the MLCW Studio npm dependency graph current.
  - package-ecosystem: npm
    directory: "/case-studies/education/my-little-creative-world/studio"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
